<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Answer paper</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1c1c;
        --muted: #5c5c5c;
        --line: #e6e6e6;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        color: var(--ink);
        touch-action: none;
      }
      /*
        The sheet fills the iframe Claude actually gives us. Native overflow
        scrolling steals Apple Pencil on iOS, so pan and pinch are handled here
        and the host is asked separately for a taller frame.
      */
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font: 14px/1.2 system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        user-select: none;
      }
      .mark {
        margin-right: 4px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: 1px solid #d0d0d0;
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #status {
        margin-left: auto;
        min-width: 8rem;
        font-size: 12px;
        color: var(--muted);
      }
      #submit {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      #zoom-label {
        min-width: 3rem;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      #frame {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
      }
      #sheet {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        background: #fff;
        touch-action: none;
      }
      #length {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 1600px;
        min-height: 1600px;
        transform-origin: 0 0;
        touch-action: none;
      }
      #tiles {
        position: absolute;
        inset: 0;
      }
      .tile {
        position: absolute;
        left: 0;
        width: 100%;
        pointer-events: none;
      }
      #paper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        touch-action: none;
        cursor: crosshair;
        user-select: none;
      }
      #resize {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 36px;
        border-top: 1px solid var(--line);
        background: #fafafa;
        color: var(--muted);
        font-size: 12px;
        cursor: ns-resize;
        touch-action: none;
        user-select: none;
      }
      .grip {
        width: 36px;
        height: 4px;
        border-radius: 999px;
        background: #c8c8c8;
      }
    </style>
  </head>
  <body>
    <!--
      Diagnostic line (temporary). A classic script, so it still runs if the
      module bundle fails to load. It reports whether the module ran, whether
      the host connected, which pointer/touch events reach this iframe, and
      any uncaught error.
    -->
    <div
      id="diag"
      style="flex: 0 0 auto; padding: 3px 8px; font: 11px/1.3 ui-monospace, monospace; color: #a00; background: #fff6ee; border-bottom: 1px solid #eee; word-break: break-all"
    >diag: waiting</div>
    <script>
      (function () {
        var d = { mod: false, host: "?", pd: 0, pm: 0, ts: 0, tm: 0, last: "", err: "" };
        window.__diag = d;
        function show() {
          var el = document.getElementById("diag");
          if (!el) return;
          el.textContent =
            "diag1 module:" + (d.mod ? "ok" : "NOT RUNNING") +
            " host:" + d.host +
            " h:" + window.innerHeight +
            " pdown:" + d.pd + " pmove:" + d.pm +
            " tstart:" + d.ts + " tmove:" + d.tm +
            (d.last ? " last:" + d.last : "") +
            (d.err ? " ERR:" + d.err : "");
        }
        window.__diagShow = show;
        document.addEventListener("pointerdown", function (e) { d.pd++; d.last = e.pointerType + "/b" + e.button; show(); }, true);
        document.addEventListener("pointermove", function () { d.pm++; if (d.pm % 10 === 0) show(); }, true);
        document.addEventListener("touchstart", function () { d.ts++; show(); }, { capture: true, passive: true });
        document.addEventListener("touchmove", function () { d.tm++; if (d.tm % 10 === 0) show(); }, { capture: true, passive: true });
        window.addEventListener("error", function (e) { d.err = String(e.message || e.error).slice(0, 160); show(); });
        window.addEventListener("unhandledrejection", function (e) { d.err = "reject:" + String(e.reason).slice(0, 160); show(); });
        document.addEventListener("DOMContentLoaded", show);
        setTimeout(show, 1500);
      })();
    </script>
    <header id="header">
      <span class="mark">Answer paper</span>
      <button type="button" id="pen" aria-pressed="true">Pen</button>
      <button type="button" id="eraser" aria-pressed="false">Eraser</button>
      <button type="button" id="undo">Undo</button>
      <button type="button" id="clear">Clear</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <span id="zoom-label">100%</span>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <span id="status" role="status" aria-live="polite"></span>
      <button type="button" id="submit">Submit</button>
    </header>
    <div id="frame">
      <div id="sheet">
        <div id="length">
          <div id="tiles"></div>
          <canvas id="paper" aria-label="Handwriting answer area"></canvas>
        </div>
      </div>
      <div
        id="resize"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Drag to make the writing area taller"
        tabindex="0"
      >
        <span class="grip" aria-hidden="true"></span>
        Pull taller
      </div>
    </div>
    <script type="module" src="./mcp-app.ts"></script>
  </body>
</html>
