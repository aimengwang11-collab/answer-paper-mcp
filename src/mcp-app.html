<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Answer paper</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1c1c;
        --muted: #5c5c5c;
        --line: #e6e6e6;
      }
      html,
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
      }
      /*
        Claude sizes the iframe from the document's border box (height: max-content).
        The scrollable sheet must not be that border box: a definite 720px frame
        keeps the artifact from collapsing to the toolbar, and the long paper
        scrolls inside it instead of stretching the iframe without limit.
      */
      body {
        display: flex;
        flex-direction: column;
        overflow: auto;
        font: 14px/1.2 system-ui, sans-serif;
        overscroll-behavior: none;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        user-select: none;
      }
      .mark {
        margin-right: 4px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: 1px solid #d0d0d0;
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #status {
        margin-left: auto;
        min-width: 8rem;
        font-size: 12px;
        color: var(--muted);
      }
      #submit {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      #frame {
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
      }
      #sheet {
        height: 720px;
        min-height: 720px;
        flex: 0 0 auto;
        overflow-x: hidden;
        overflow-y: scroll;
        overscroll-behavior: contain;
        background: #fff;
        touch-action: none;
      }
      #length {
        position: relative;
        width: 100%;
        height: 1600px;
        min-height: 1600px;
      }
      #tiles {
        position: absolute;
        inset: 0;
      }
      .tile {
        position: absolute;
        left: 0;
        width: 100%;
        pointer-events: none;
      }
      #paper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        touch-action: none;
        cursor: crosshair;
        user-select: none;
      }
      #resize {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 36px;
        border-top: 1px solid var(--line);
        background: #fafafa;
        color: var(--muted);
        font-size: 12px;
        cursor: ns-resize;
        touch-action: none;
        user-select: none;
      }
      .grip {
        width: 36px;
        height: 4px;
        border-radius: 999px;
        background: #c8c8c8;
      }
    </style>
  </head>
  <body>
    <header id="header">
      <span class="mark">Answer paper</span>
      <button type="button" id="pen" aria-pressed="true">Pen</button>
      <button type="button" id="eraser" aria-pressed="false">Eraser</button>
      <button type="button" id="undo">Undo</button>
      <button type="button" id="clear">Clear</button>
      <span id="status" role="status" aria-live="polite"></span>
      <button type="button" id="submit">Submit</button>
    </header>
    <div id="frame">
      <div id="sheet">
        <div id="length">
          <div id="tiles"></div>
          <canvas id="paper" aria-label="Handwriting answer area"></canvas>
        </div>
      </div>
      <div
        id="resize"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Drag to make the writing area taller"
        tabindex="0"
      >
        <span class="grip" aria-hidden="true"></span>
        Pull taller
      </div>
    </div>
    <script type="module" src="./mcp-app.ts"></script>
  </body>
</html>
