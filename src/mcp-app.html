<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Answer paper</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1c1c;
        --muted: #5c5c5c;
        --line: #e6e6e6;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        color: var(--ink);
      }
      body {
        min-height: 320px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font: 14px/1.2 system-ui, sans-serif;
        overscroll-behavior: none;
      }
      header {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        user-select: none;
      }
      .mark {
        margin-right: 4px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: 1px solid #d0d0d0;
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #status {
        margin-left: auto;
        min-width: 8rem;
        font-size: 12px;
        color: var(--muted);
      }
      #submit {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      #sheet {
        flex: 1 1 auto;
        min-height: 0;
        background: #fff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #fff;
        touch-action: none;
        cursor: crosshair;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">Answer paper</span>
      <button type="button" id="pen" aria-pressed="true">Pen</button>
      <button type="button" id="eraser" aria-pressed="false">Eraser</button>
      <button type="button" id="undo">Undo</button>
      <button type="button" id="clear">Clear</button>
      <span id="status" role="status" aria-live="polite"></span>
      <button type="button" id="submit">Submit</button>
    </header>
    <div id="sheet">
      <canvas id="paper" aria-label="Handwriting answer area"></canvas>
    </div>
    <script type="module" src="./mcp-app.ts"></script>
  </body>
</html>
